[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethicalwall"
version = "0.1.0"
description = "Permission-aware retrieval over CUAD contracts with ethical walls enforced in the vector search."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qdrant-client>=1.10",
    "sentence-transformers>=3.0",
    "datasets>=2.18",
    "statsmodels>=0.14",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
